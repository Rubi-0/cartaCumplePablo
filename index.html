<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Juego de cumpleaños</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <main class="game">
        <!-- Pantalla 1: cargando partida -->
        <section
        class="screen screen--loading"
        id="loading-screen"
        aria-labelledby="loading-title"
        >
            <div class="night-sky" aria-hidden="true"></div>

            <div class="loading-interface">
                <img
                    class="loading-character"
                     src="assets/images/characters/pablo-side.png"
                     alt="Pablo observando el horizonte"
                >

                <div class="loading-panel">
                    <h1 id="loading-title">
                        CARGANDO PARTIDA...
                    </h1>

                    <p class="loading-player">
                        JUGADOR: <strong>PABLO</strong>
                    </p>

                    <div class="progress-group">
                        <div
                            class="progress-track"
                            role="progressbar"
                            aria-label="Progreso de carga"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            aria-valuenow="0"
                        >
                            <div
                                class="progress-fill"
                                id="loading-progress"
                            ></div>
                        </div>

                        <span id="loading-percentage">0%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Pantalla 2: partida encontrada -->
        <section
            class="screen"
            id="save-screen"
            aria-labelledby="save-title"
            hidden
        >
            <div 
             class="night-sky night-sky--save"
             aria-hidden="true"
            ></div>

            <div class="save-interface">
                <article class="save-panel">
                    <h1 id="save-title">
                        PARTIDA ENCONTRADA
                    </h1>

                    <div class="save-content">
                        <div class="portrait-frame">
                            <img
                                src="assets/images/characters/pablo-idle.png"
                                alt="Personaje pixelado de Pablo"
                            >
                        </div>

                        <dl class="player-data">
                            <div class="data-row">
                                <dt>JUGADOR:</dt>
                                <dd>PABLO</dd>
                            </div>

                            <div class="data-row">
                                <dt>NIVEL:</dt>
                                <dd>21</dd>
                            </div>

                            <div class="data-row">
                                <dt>ESTADO:</dt>
                                <dd class="status">COMPLETADO</dd>
                            </div>
                        </dl>
                    </div>
                </article>

                <button id="continue-button" type="button">
                    <span aria-hidden="true">▶</span>
                    CONTINUAR
                </button>
            </div>
        </section>
    </main>
</body>
</html>
